# GDELT DOC 2.0 API + GKG
# Verified from the box by HTTP GET on 2026-10-15; only sources returning valid content are kept.
doc_api:
  base: https://api.gdeltproject.org/api/v2/doc/doc
  min_interval_s: 6
  timespan: 1h
  notes: mode=artlist for articles, mode=timelinetone / tonechart for tone per country; GDELT returns 429 if called faster than ~1 req/5s
  queries:
  - id: us
    country: US
    region: north_america
    lang: en
    query: sourcecountry:US
    verified: null
    status: unverified (HTTP 429 rate-limit at check time)
  - id: canada
    country: Canada
    region: north_america
    lang: en
    query: sourcecountry:CA
    verified: '2026-10-15'
    status: ok
