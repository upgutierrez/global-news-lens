gkg:
  lastupdate_url: http://data.gdeltproject.org/gdeltv2/lastupdate.txt
  verified: null
  notes: 15-min CSV zips (export, mentions, gkg). Filter GKG V2Locations/V2Tone/Themes per country FIPS code; or use BigQuery gdelt-bq.gdeltv2.gkg_partitioned
  example_filters:
  - country_fips: US
    themes:
    - ARMEDCONFLICT
    - ELECTION
    - PROTEST
    - SANCTIONS
